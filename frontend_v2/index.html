<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gateway V2</title>
    <style>
      body { margin:0; background:#0d0f1a; display:flex; align-items:center; justify-content:center; min-height:100vh; }
      #boot-loader { display:flex; flex-direction:column; align-items:center; gap:16px; }
      #boot-loader .spinner { width:40px; height:40px; border:3px solid rgba(99,102,241,0.2); border-top-color:#6366f1; border-radius:50%; animation:spin 0.8s linear infinite; }
      #boot-loader p { color:#6b7280; font-family:system-ui,sans-serif; font-size:14px; margin:0; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-loader">
        <div class="spinner"></div>
        <p>Đang tải Gateway V2...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
