services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    network_mode: host # Required for BACnet/IP UDP broadcast
    volumes:
      - ./config:/app/config
    depends_on:
      - mosquitto
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf

volumes:
  mosquitto_data:
  mosquitto_log:
